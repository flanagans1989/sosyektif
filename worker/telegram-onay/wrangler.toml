name = "sosyektif-telegram-onay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Deploy edilen gerçek adres (2026-09-12'de Telegram getWebhookInfo ile
# doğrulandı — bu Worker, site/domain'in olduğu "Sosyektif@gmail.com's
# Account" Cloudflare hesabında DEĞİL, "deraks-rental" workers.dev alt alan
# adına sahip başka bir hesapta deploy edilmiş durumda):
# https://sosyektif-telegram-onay.deraks-rental.workers.dev

# Yedek tetikleyici: Cloudflare her saat :17'de worker'ı uyandırmaya çalışır.
# Not (2026-09-11): bu cron Cloudflare dashboard'unda kayıtlı görünmesine
# rağmen hiç çalışmadı — wrangler tail ile canlı doğrulandı (dakikalık crona
# geçirilip 3 dakika izlendi, tek bir zamanlanmış çağrı bile gelmedi). Sebep
# bulunamadı (muhtemelen hesaba özgü bir kısıt); yedek olarak duruyor, zarar
# vermiyor. ASIL tetikleyici artık dışarıdan cron-job.org'un saatte bir
# GET /tetikle?anahtar=... çağrısı (bkz. src/index.ts). GitHub'ın kendi
# "schedule" tetikleyicisi de az hareketli repolarda saatlerce gecikiyor;
# ikisine de güvenmek yerine bu dış tetikleyici asıl mekanizma.
[triggers]
crons = ["17 * * * *"]

# Tepki barı sayaçları (PLAN.md Bölüm 10 / S2). Bu Worker dashboard'dan
# "Quick Edit" ile deploy edildiği için bu blok gerçek deploy'u etkilemiyor
# (KV bağlama işlemi dashboard > Bindings sekmesinden elle yapıldı,
# 2026-09-12) — burada sadece belgeleme/gelecekteki wrangler deploy için.
[[kv_namespaces]]
binding = "METRIKLER"
id = "fdb4338b9f094a2083dcb827207c2d80" # sosyektif_metrikler (deraksizolasyon hesabı)

# Tepki sayaçları AYRI namespace'te (2026-09-18): herkese açık /tepki, METRIKLER'le
# (Meta token'ları + Reels videoları) aynı günlük yazma kotasını paylaşmasın.
# Kod "TEPKI" varsa onu kullanır; eski sayaçlar METRIKLER'den okunmaya devam eder.
[[kv_namespaces]]
binding = "TEPKI"
id = "c62521dd264f47c0abc938e0804cca93" # sosyektif-telegram-onay-sosyektif_tepki
#
# Not: koddaki hız sınırı (hizSiniri) bellekte, yalnızca Worker örneği (isolate)
# başına geçerli — kaba bir ilk savunma. Kalıcı/genel sınır için Durable Object
# ya da Worker'ı bir zone altındaki özel alan adına taşıyıp WAF rate limiting
# kuralı gerekir (workers.dev alt alanına zone WAF kuralı uygulanamaz).
# Bunun dışında /tepki artık Origin + var olan yazı + IP başı 10/dk şartı arıyor.

# Secrets (dashboard > Settings > Variables and Secrets ile eklenir, buraya YAZILMAZ):
#   GITHUB_TOKEN            - "Contents: Read and write" + "Actions: Read and write" izinli fine-grained PAT (sadece bu repo için)
#   GITHUB_REPO             - "kullanici/repo" formatinda, orn. flanagans1989/sosyektif
#   TELEGRAM_BOT_TOKEN      - BotFather'dan alinan token
#   TELEGRAM_WEBHOOK_SECRET - setWebhook cagrisinda verilen rastgele gizli deger
#   TELEGRAM_ADMIN_CHAT_ID  - sadece bu chat'ten gelen callback_query kabul edilir
#   TETIKLE_ANAHTARI        - cron-job.org'un GET /tetikle?anahtar=... çağrısında
#                             göndereceği rastgele değer (GitHub/Telegram
#                             token'larından bağımsız, yalnızca bu uç noktayı korur)
#   AGENT_PAYLASIM_ANAHTARI - agents'ın (GitHub Actions) /meta-token GET/POST
#                             uç noktalarını çağırırken göndereceği rastgele
#                             değer (Bölüm 11.2, Threads/Instagram token
#                             okuma/yazma). GitHub Secrets'taki aynı isimli
#                             secret ile birebir eşleşmeli.
