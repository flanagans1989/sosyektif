name: Sağlık Denetimi

# Gözetim ajanı (agents/src/orchestrator/saglikDenetimi.ts): site, zamanlayıcı,
# workflow hataları, veri dosyaları, tüm API anahtarları ve her sosyal kanalın
# GERÇEK hesabı 6 saatte bir ölçülür. Bilinen arızalar otomatik onarılır
# (başarısız workflow'u yeniden başlatma, durmuş zamanlayıcıyı tetikleme,
# vazgeçilmiş paylaşımları kuyruğa geri alma); yalnızca yeni/çözülen/onarılan
# sorunlar Telegram'a yazılır. TR 09:00 çalışmasında tüm açık sorunlar listelenir.
on:
  schedule:
    - cron: "23 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      tam_rapor:
        description: "Açık sorunların tamamını Telegram'a gönder"
        type: boolean
        default: false

concurrency:
  group: sosyektif-saglik
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      - name: Denetle ve onar
        working-directory: agents
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAM_RAPOR: ${{ inputs.tam_rapor && '1' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          AGENT_PAYLASIM_ANAHTARI: ${{ secrets.AGENT_PAYLASIM_ANAHTARI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
        run: npm run saglik-denetimi
