name: Reel Önizleme (Telegram'a Gönder)

# Kullanıcı "genelde dışarıda oluyorum, Telegram'dan izleyip onay versem"
# dediği için (PLAN.md Bölüm 11.9): bir slug girip Actions sekmesinden ya da
# GitHub mobil uygulamasından tetiklenince, o içeriğin Reels videosu
# "✅ Reels olarak paylaş / ❌ Paylaşma" butonlarıyla admin Telegram
# sohbetine düşer. Bu iş kendisi paylaşım yapmaz — ✅'e basılınca worker
# reel-paylas.yml'i başlatır.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Önizlenecek içeriğin slug'ı (site/src/content/posts/<slug>.md)"
        required: true
        type: string
      muzik_karsilastir:
        description: "Aynı videoyu her müzikle ayrı ayrı gönder (müzik seçmek için, butonsuz)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reel-onizle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      - name: Chromium önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('agents/package-lock.json') }}

      # Chromium + renkli emoji fontu (yoksa emoji'ler kutu çıkıyor) + ffmpeg
      # (ffmpeg-static paketinin ikili dosyası inmezse yedek).
      - name: Render bağımlılıkları
        working-directory: agents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg
          npx playwright-core install --with-deps chromium

      - working-directory: agents
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: npm run reel-onizle-telegram -- "${{ inputs.slug }}" ${{ inputs.muzik_karsilastir && '--muzik-karsilastir' || '' }}
