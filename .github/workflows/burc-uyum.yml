name: Burç Uyumu (tek seferlik)

# Uyum yorumları zamansız; zamanlanmış değil, elle tetiklenir. Eksik çift
# kalırsa tekrar çalıştırmak kaldığı yerden devam ettirir.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  burc-uyum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      - working-directory: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: npm run burc-uyum

      - name: Değişiklikleri commit'le ve gönder
        run: |
          git config user.name "sosyektif-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/burc-uyum.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Burç uyumu yorumları eklendi"
            git pull --rebase origin main
            git push
          fi
