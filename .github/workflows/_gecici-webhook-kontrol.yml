name: Geçici — Webhook URL kontrolü
on:
  workflow_dispatch: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Telegram webhook bilgisini sorgula
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | \
            node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log('url:', j.result.url);console.log('pending_update_count:', j.result.pending_update_count);console.log('last_error_message:', j.result.last_error_message || '(yok)');})"
