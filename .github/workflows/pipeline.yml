name: İçerik Pipeline'ı

on:
  schedule:
    # Saatte bir, tam saat yerine :17'de. GitHub az hareketli repolarda
    # zamanlanmış çalışmaları saatlerce geciktirip bazılarını hiç yapmıyor;
    # sık tetikleyip yayın zamanlamasını pipeline.ts'e bıraktık (TR 08-24
    # arası, iki içerik arası en az 3 saat, günlük hedef). Repo public olduğu
    # için Actions dakikaları ücretsiz.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      hedef_atla:
        description: "Yayın penceresi ve günlük hedef kontrolünü atla (manuel test için)"
        type: boolean
        default: false

concurrency:
  group: sosyektif-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # dağıtım kuyruğunu başlatmak için

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: agents
        run: npm ci

      - name: Chromium önbelleği (carousel slayt render'ı)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('agents/package-lock.json') }}

      # Instagram carousel slaytları HTML/CSS olarak gerçek tarayıcıda render
      # ediliyor (agents/src/image/htmlRender.ts). Renkli emoji fontu olmadan
      # emoji'ler bozuk çıkar.
      - name: Slayt render bağımlılıkları (Chromium + renkli emoji fontu + ffmpeg)
        working-directory: agents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg
          npx playwright-core install --with-deps chromium

      - name: Pipeline'ı çalıştır
        working-directory: agents
        env:
          GUNLUK_HEDEF_ATLA: ${{ (github.event_name == 'workflow_dispatch' && inputs.hedef_atla) && '1' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          AGENT_PAYLASIM_ANAHTARI: ${{ secrets.AGENT_PAYLASIM_ANAHTARI }}
        run: npm run pipeline

      - name: Değişiklikleri commit'le ve gönder
        id: commit
        run: |
          git config user.name "sosyektif-bot"
          git config user.email "deraksizolasyon@gmail.com"
          # Her yol tek tek eklenir: site/public/images/social/ bu içerik hiç
          # Instagram/Facebook görseli üretmediyse (ör. paylaşım atlandıysa)
          # checkout'ta hiç var olmuyor — tek bir "git add" çağrısında bu,
          # pathspec hatasıyla TÜM adımı (data/ ve gönderiler dahil) iptal
          # ediyordu (2026-09-13, ~8 saat boyunca hiçbir içerik commit'lenmedi,
          # sessizce fark edilmeden). Eksik yol artık sadece atlanır.
          for yol in data/ site/src/content/posts/ site/public/images/posts/ site/public/images/social/; do
            if [ -d "$yol" ]; then
              git add "$yol"
            fi
          done
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Otomatik içerik güncellemesi ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # Çalışma sürerken Telegram onay worker'ı ya da başka bir workflow
            # main'e commit atmış olabilir; push reddedilmesin diye önce üstüne al.
            git pull --rebase origin main
            git push
            echo "yeni=1" >> "$GITHUB_OUTPUT"
          fi

      # Sosyal medya paylaşımı artık ayrı bir kuyrukta (dagitim.yml): içerik
      # canlıya çıktıktan sonra paylaşır, başarısız kanalları tekrar dener.
      - name: Dağıtım kuyruğunu başlat
        if: steps.commit.outputs.yeni == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dagitim.yml --ref main
