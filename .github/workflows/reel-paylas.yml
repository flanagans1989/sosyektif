name: Reels Paylaş (Telegram onayı sonrası)

# Telegram'daki "✅ Reels olarak paylaş" butonuna basılınca worker
# (worker/telegram-onay, reel_ok) bu işi başlatır (PLAN.md Bölüm 11.9):
# video üretilip siteye yüklenir, canlıya çıkınca Instagram Reels + Facebook
# video + YouTube Shorts olarak paylaşılır, sonuç Telegram'a bildirilir.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Paylaşılacak içeriğin slug'ı"
        required: true
        type: string

concurrency:
  group: sosyektif-reel-paylas-${{ inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel-paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      - name: Chromium önbelleği
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('agents/package-lock.json') }}

      - name: Render bağımlılıkları
        working-directory: agents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg
          npx playwright-core install --with-deps chromium

      - working-directory: agents
        env:
          AGENT_PAYLASIM_ANAHTARI: ${{ secrets.AGENT_PAYLASIM_ANAHTARI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # YouTube Shorts (yapılandırılmamışsa yükleme atlanır, bkz. src/lib/youtube.ts)
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run reel-paylas -- "${{ inputs.slug }}"
