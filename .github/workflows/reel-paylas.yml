name: Reels Paylaş (Telegram onayı sonrası)

# Telegram'daki "✅ Reels olarak paylaş" butonuna basılınca worker
# (worker/telegram-onay, reel_ok) bu işi başlatır (PLAN.md Bölüm 11.9):
# video üretilip siteye yüklenir, canlıya çıkınca Instagram Reels + Facebook
# video olarak paylaşılır, sonuç Telegram'a bildirilir.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Paylaşılacak içeriğin slug'ı"
        required: true
        type: string

concurrency:
  group: sosyektif-reel-paylas-${{ inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reel-paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      - name: Chromium önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('agents/package-lock.json') }}

      - name: Render bağımlılıkları
        working-directory: agents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg
          npx playwright-core install --with-deps chromium

      - working-directory: agents
        env:
          AGENT_PAYLASIM_ANAHTARI: ${{ secrets.AGENT_PAYLASIM_ANAHTARI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: npm run reel-paylas -- "${{ inputs.slug }}"
