name: Haftalık Analitik

on:
  schedule:
    - cron: "0 5 * * 1" # her Pazartesi 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  weekly-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      - working-directory: agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: npm run weekly-analytics

      # Sosyal performans ajanı (PLAN.md 11.6): analytics/index.ts'in
      # üzerine, Instagram/Facebook etkileşimini küçük bir sinyal olarak
      # ekler. AGENT_PAYLASIM_ANAHTARI yoksa/token'lar eksikse sessizce
      # atlanır (R5 deseni) — ayrı bir job'a gerek yok, hatası bu adımı
      # (dolayısıyla commit'i) etkilemesin diye continue-on-error.
      - working-directory: agents
        continue-on-error: true
        env:
          AGENT_PAYLASIM_ANAHTARI: ${{ secrets.AGENT_PAYLASIM_ANAHTARI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: npm run sosyal-performans

      - name: category-weights.json'u commit'le
        run: |
          git config user.name "sosyektif-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/category-weights.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Haftalık kategori ağırlıkları güncellendi"
            git pull --rebase origin main
            git push
          fi
