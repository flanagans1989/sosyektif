name: Haftalık Analitik

on:
  schedule:
    - cron: "0 5 * * 1" # her Pazartesi 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  weekly-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      - working-directory: agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: npm run weekly-analytics

      - name: category-weights.json'u commit'le
        run: |
          git config user.name "sosyektif-bot"
          git config user.email "deraksizolasyon@gmail.com"
          git add data/category-weights.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Haftalık kategori ağırlıkları güncellendi"
            git push
          fi
