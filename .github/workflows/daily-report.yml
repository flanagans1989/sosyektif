name: Günlük Rapor

on:
  schedule:
    - cron: "0 6 * * *" # her gün 06:00 UTC (TR saatiyle 09:00)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      - working-directory: agents
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Meta (Threads/Instagram/Facebook) token süre kontrolü için.
          AGENT_PAYLASIM_ANAHTARI: ${{ secrets.AGENT_PAYLASIM_ANAHTARI }}
        run: npm run daily-report
