name: Günlük Burç ve Tarihte Bugün

# Tetikleyiciler: GitHub'ın kendi schedule'ı (aşağıda) ve yedek olarak Cloudflare
# Worker'ın saatlik cron'u (bkz. worker/telegram-onay). İki script de idempotent
# olduğu için çift çalışma içeriği değiştirmez.
on:
  schedule:
    # TR 05:30, 07:30, 09:30, 11:30 — GitHub bazı zamanlanmış çalışmaları
    # atlayabildiği için birkaç deneme; üretim idempotent, sonrakiler bir şey yapmaz.
    - cron: "30 2,4,6,8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gunluk-icerik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: agents/package-lock.json

      - working-directory: agents
        run: npm ci

      # Biri başarısız olursa diğerinin çıktısı yine commit'lensin.
      - name: Burç yorumları
        working-directory: agents
        continue-on-error: true
        run: npm run burc

      - name: Tarihte Bugün seçkisi
        working-directory: agents
        continue-on-error: true
        run: npm run tarihte-bugun

      - name: Değişiklikleri commit'le ve gönder
        run: |
          git config user.name "sosyektif-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/gunluk-burc.json site/src/data/haftalik-burc.json site/src/data/tarihte-bugun.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Günlük içerik güncellendi: burç, tarihte bugün ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
