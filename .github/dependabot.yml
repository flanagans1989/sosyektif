# Güncellemeler PR olarak gelir (pr-kontrol.yml doğrular). Ana sürüm (major) atlamaları
# kapalı: sistem otomatik yayın yapıyor ve API adaptörlerini (Bluesky, Meta, Telegram)
# canlı test etmeden major bump güvenli değil — gerektiğinde elle yükseltilir.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /worker/telegram-onay
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
